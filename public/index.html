<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101510">
  <title>Meu personal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <main class="auth-shell" id="login-view">
      <section class="auth-card">
        <div class="brand-mark">MP</div>
        <p class="eyebrow">SEU TREINO. SUA EVOLUÇÃO.</p>
        <h1>Meu personal</h1>
        <p class="muted">Entre para acessar sua área de treinamento.</p>
        <form id="login-form">
          <label>E-mail<input id="login-email" type="email" placeholder="seu@email.com" required autocomplete="username"></label>
          <label>Senha<input id="login-password" type="password" placeholder="Sua senha" required autocomplete="current-password"></label>
          <button class="btn primary full" type="submit">Entrar</button>
          <p class="form-error" id="login-error" role="alert"></p>
        </form>
        <div class="demo-box">
          <strong>Acesso de demonstração</strong>
          <span>Administrador: admin@meupersonal.com / 123456</span>
          <span>Aluno: aluno@meupersonal.com / 123456</span>
        </div>
      </section>
    </main>

    <div id="app-view" class="hidden">
      <aside class="sidebar">
        <div class="sidebar-brand"><span class="brand-mark small">MP</span><span>Meu personal</span></div>
        <div class="user-mini"><div class="avatar" id="side-avatar">MP</div><div><strong id="side-name">Usuário</strong><small id="side-role">Área</small></div></div>
        <nav id="navigation"></nav>
        <button class="btn ghost logout" id="logout-button">Sair da conta</button>
      </aside>
      <main class="main-area">
        <header class="topbar">
          <div><p class="eyebrow" id="page-eyebrow">PAINEL</p><h1 id="page-title">Visão geral</h1></div>
          <div class="topbar-user"><span id="topbar-name"></span><div class="avatar" id="top-avatar">MP</div></div>
        </header>
        <section id="page-content"></section>
      </main>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
